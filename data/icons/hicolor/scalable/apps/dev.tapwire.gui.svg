<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="0" y1="24" x2="0" y2="80">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#deddda"/>
      <stop offset="1" stop-color="#9a9996"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#99c1f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#0b2a55" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background tile -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>

  <!-- faucet -->
  <g filter="url(#shadow)">
    <!-- wall plate -->
    <rect x="14" y="33" width="9" height="26" rx="3.5" fill="url(#metal)"/>
    <!-- pipe: from the wall, then curving down into the spout -->
    <path d="M22 46 H72 a16 16 0 0 1 16 16 V68" fill="none" stroke="url(#metal)" stroke-width="16"/>
    <!-- nozzle -->
    <rect x="77" y="66" width="22" height="11" rx="3.5" fill="url(#metal)"/>
    <!-- valve stem and handle -->
    <rect x="43" y="29" width="12" height="12" fill="url(#metal)"/>
    <rect x="30" y="22" width="38" height="9" rx="4.5" fill="url(#metal)"/>
  </g>

  <!-- falling drop -->
  <path d="M88 84 C88 84 78.5 95.5 78.5 101.5 a9.5 9.5 0 0 0 19 0 C97.5 95.5 88 84 88 84 Z" fill="url(#drop)"/>
  <path d="M83.5 100 a5 5 0 0 0 3.5 5" fill="none" stroke="#1a5fb4" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
</svg>
